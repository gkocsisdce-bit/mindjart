<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zakynthos Visszaszámláló</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Megbízhatóbb forrásból származó HD Zakynthos kép */
            --bg-image: url('Zbeach.jpg');
            --primary-blue: #0077be;
            --accent-gold: #f4d03f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0c3d5d;
            /* Fontos: itt a linear-gradient és a kép sorrendje */
            background-image: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)), var(--bg-image);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
                background-position: center center;
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            #main-container { border-radius: 20px; padding: 18px; }
        }

        #main-container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: clamp(20px, 5vw, 40px);
            border-radius: clamp(20px, 4vw, 30px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.25);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        p { margin-bottom: 25px; font-size: clamp(1rem, 4vw, 1.2rem); font-weight: 400; }
        .hidden { display: none !important; }

        .tiles { display: flex; flex-direction: column; gap: clamp(10px, 3vw, 20px); }
        .tile {
            background: white;
            color: var(--primary-blue);
            padding: clamp(15px, 4vw, 25px);
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: clamp(1rem, 4vw, 1.3rem);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: none;
            width: 100%;
        }
        .tile:hover { background: var(--accent-gold); color: #333; transform: scale(1.03); }
        .tile:active { transform: scale(0.98); }

        .time-val {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: bold;
            color: var(--accent-gold);
            display: block;
            margin: 15px 0;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .kids-view-text { font-family: 'Caveat', cursive; font-size: clamp(1.8rem, 7vw, 2.8rem); line-height: 1.1; }

        .back-btn {
            margin-top: clamp(20px, 6vw, 35px);
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: 0.3s;
            width: auto;
        }
        .back-btn:hover { background: white; color: var(--primary-blue); }

        .sub-label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-top: 25px;
            opacity: 0.9;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 8px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <h1>Irány Zakynthos! 🚢</h1>

        <div id="step-1">
            <p>Ki érkezett az oldalra?</p>
            <div class="tiles">
                <button class="tile" onclick="goToStep('kids')">🍦 Gyerek vagyok</button>
                <button class="tile" onclick="goToStep('felnott-select')">☕ Felnőtt vagyok</button>
            </div>
        </div>

        <div id="felnott-select" class="hidden">
            <p>Melyik várostól indultok?</p>
            <div class="tiles">
                <button class="tile" onclick="startAdult('Debrecen')">Debrecen</button>
                <button class="tile" onclick="startAdult('Veresegyház')">Veresegyház</button>
            </div>
            <button class="back-btn" onclick="goToStep('step-1')">← Vissza</button>
        </div>

        <div id="view-kids" class="hidden">
            <div class="kids-view-text">
                Már csak
                <span id="sleep-count" class="time-val">0</span>
                éjszakát kell aludni a nyaralásig! ✨🌊
            </div>
            <button class="back-btn" onclick="goToStep('step-1')">← Vissza</button>
        </div>

        <div id="view-adult" class="hidden">
            <div>
                <span class="sub-label" id="loc-label">Indulás a parkolóhoz</span>
                <span id="car-timer" class="time-val" style="font-size: clamp(1.4rem, 5vw, 2rem);">--</span>

                <span class="sub-label">Gépfelszállásig (12:30)</span>
                <span id="flight-timer" class="time-val" style="font-size: clamp(1.4rem, 5vw, 2rem);">--</span>
            </div>
            <button class="back-btn" onclick="goToStep('step-1')">← Vissza</button>
        </div>
    </div>

    <script>
        const FLIGHT_DATE = new Date("2026-06-18T12:30:00");
        const PARKING_TARGET = new Date("2026-06-18T10:00:00");

        const OFFSETS = {
            "Debrecen": (2*60 + 40) * 60000,
            "Veresegyház": (0*60 + 40) * 60000
        };

        let timer = null;
        let activeLoc = "";

        function goToStep(stepId) {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('felnott-select').classList.add('hidden');
            document.getElementById('view-kids').classList.add('hidden');
            document.getElementById('view-adult').classList.add('hidden');

            const target = stepId === 'kids' ? 'view-kids' : (stepId === 'adult' ? 'view-adult' : stepId);
            document.getElementById(target).classList.remove('hidden');

            if (timer) clearInterval(timer);
            if (stepId === 'kids') updateKids();
        }

        function updateKids() {
            const now = new Date();
            const d1 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const d2 = new Date(FLIGHT_DATE.getFullYear(), FLIGHT_DATE.getMonth(), FLIGHT_DATE.getDate());
            const diffDays = Math.max(0, Math.floor((d2 - d1) / (1000 * 60 * 60 * 24)));
            document.getElementById('sleep-count').innerText = diffDays;
        }

        function startAdult(loc) {
            activeLoc = loc;
            document.getElementById('loc-label').innerText = "Indulás a parkolóhoz" + loc + "-ról";
            goToStep('adult');
            timer = setInterval(updateAdult, 1000);
            updateAdult();
        }

        function updateAdult() {
            const now = new Date();
            const startAt = new Date(PARKING_TARGET.getTime() - OFFSETS[activeLoc]);
            document.getElementById('car-timer').innerText = format(startAt - now);
            document.getElementById('flight-timer').innerText = format(FLIGHT_DATE - now);
        }

        function format(ms) {
            if (ms < 0) return "INDULJ! ✈️";
            const d = Math.floor(ms / 86400000);
            const h = Math.floor((ms % 86400000) / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            return `${d} nap ${h}ó ${m}p ${s}mp`;
        }
    </script>
</body>
</html>
